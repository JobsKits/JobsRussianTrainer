[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs-russian-trainer"
version = "1.0.0"
description = "俄语辅音与元音交叉发音练习表"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.gui-scripts]
jobs-russian-trainer = "russian_trainer.app:main"

[tool.setuptools.packages.find]
where = ["src"]
